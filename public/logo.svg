<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d22"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e6962a"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="220"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- the screen's top edge with the island hanging from it -->
    <rect x="64" y="64" width="896" height="150" fill="#000" opacity="0.35"/>
    <path d="M300 214 H724 a0 0 0 0 1 0 0 V300 a96 96 0 0 1 -96 96 H396 a96 96 0 0 1 -96 -96 Z" fill="url(#amber)"/>
  </g>
  <rect x="64.5" y="64.5" width="895" height="895" rx="219.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- a soft "dropping" trail -->
  <rect x="452" y="470" width="120" height="16" rx="8" fill="#f2b44c" opacity="0.55"/>
  <rect x="482" y="530" width="60" height="16" rx="8" fill="#f2b44c" opacity="0.3"/>
</svg>
