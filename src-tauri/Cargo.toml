[package]
name = "wisp-dock"
version = "1.6.1"
description = "Brim - a local-first floating utility dock for Windows"
authors = ["Kaustubh Chowdhury"]
license-file = "../LICENSE.txt"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
windows-core = "0.62"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The `windows` bindings crate is enormous; optimising it as a single codegen unit needs
# several GB of RAM. Splitting it keeps release builds reliable on ordinary machines.
[profile.release.package.windows]
codegen-units = 16
opt-level = 1
